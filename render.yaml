services:
  - type: web
    name: aurum-forge-api
    env: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.main --serve --host 0.0.0.0 --port 10000
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
